<text class="ts" x="340" y="596" text-anchor="middle">Lower case: names inside a box. Upper case: names outside the Chain.</text>
<text class="ts" x="340" y="616" text-anchor="middle">The wires carry the Chain's own names and connect the two Gain modules.</text>
<text class="ts" x="340" y="636" text-anchor="middle">Purple wires carry data, teal wires carry configuration.</text>
