<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>A Chain module built from two Gain modules</title>
<desc>An outer box called Chain contains two inner boxes, first and second, both Gain modules. The output of the first box is wired to an input of the second box. Chain has three inputs at the bottom, two outputs at the top and two configuration slots at the sides, each wired to the kind slot of one of the Gain boxes. Inside each box the names are lower case, outside the Chain they are upper case.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; dominant-baseline: central; fill: #2C2C2A; }
  .t  { font-size: 14px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .outer { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
  .inner { fill: #FFFFFF; stroke: #888780; stroke-width: 1; }
  .data { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .wire { stroke: #7F77DD; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .dot { fill: #7F77DD; }
  .conf { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .wire-conf { stroke: #1D9E75; stroke-width: 2; stroke-linecap: round; fill: none; }
  @media (prefers-color-scheme: dark) {
    text { fill: #F1EFE8; }
    .ts { fill: #B4B2A9; }
    .outer { fill: #2C2C2A; stroke: #888780; }
    .inner { fill: #444441; stroke: #B4B2A9; }
    .data { fill: #3C3489; stroke: #AFA9EC; }
    .conf { fill: #085041; stroke: #5DCAA5; }
  }
</style>
