<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>A module as a box with inputs, outputs and configuration slots</title>
<desc>A box with two input slots at the bottom, two output slots at the top and two configuration slots on the left. Inside the box the slots have lower case internal names, outside they have upper case external names.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; dominant-baseline: central; fill: #2C2C2A; }
  .t  { font-size: 14px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
  .data { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .conf { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .wire-data { stroke: #7F77DD; stroke-width: 2; stroke-linecap: round; fill: none; }
  .wire-conf { stroke: #1D9E75; stroke-width: 2; stroke-linecap: round; fill: none; }
  @media (prefers-color-scheme: dark) {
    text { fill: #F1EFE8; }
    .ts { fill: #B4B2A9; }
    .box { fill: #2C2C2A; stroke: #888780; }
    .data { fill: #3C3489; stroke: #AFA9EC; }
    .conf { fill: #085041; stroke: #5DCAA5; }
  }
</style>
<defs>
  <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box" x="200" y="110" width="300" height="180" rx="8"/>
<text class="th" x="350" y="200" text-anchor="middle">Gain</text>

<line class="wire-data" x1="290" y1="102" x2="290" y2="62" marker-end="url(#arrow-data)"/>
<line class="wire-data" x1="410" y1="102" x2="410" y2="62" marker-end="url(#arrow-data)"/>
<rect class="data" x="282" y="102" width="16" height="16" rx="3"/>
<rect class="data" x="402" y="102" width="16" height="16" rx="3"/>
<text class="t" x="290" y="138" text-anchor="middle">y</text>
<text class="t" x="410" y="138" text-anchor="middle">peak</text>
<text class="th" x="290" y="44" text-anchor="middle">AMPLIFIED</text>
<text class="th" x="410" y="44" text-anchor="middle">MAXIMUM</text>
<text class="ts" x="520" y="70" text-anchor="start">Outputs (omap)</text>

<line class="wire-data" x1="290" y1="346" x2="290" y2="302" marker-end="url(#arrow-data)"/>
<line class="wire-data" x1="410" y1="346" x2="410" y2="302" marker-end="url(#arrow-data)"/>
<rect class="data" x="282" y="282" width="16" height="16" rx="3"/>
<rect class="data" x="402" y="282" width="16" height="16" rx="3"/>
<text class="t" x="290" y="262" text-anchor="middle">x</text>
<text class="t" x="410" y="262" text-anchor="middle">gain</text>
<text class="th" x="290" y="364" text-anchor="middle">SIGNAL</text>
<text class="th" x="410" y="364" text-anchor="middle">GAIN2</text>
<text class="ts" x="520" y="330" text-anchor="start">Inputs (imap)</text>

<line class="wire-conf" x1="108" y1="165" x2="192" y2="165"/>
<line class="wire-conf" x1="108" y1="235" x2="192" y2="235"/>
<rect class="conf" x="192" y="157" width="16" height="16" rx="3"/>
<rect class="conf" x="192" y="227" width="16" height="16" rx="3"/>
<text class="t" x="220" y="165" text-anchor="start">kind</text>
<text class="t" x="220" y="235" text-anchor="start">mode</text>
<text class="th" x="100" y="165" text-anchor="end">TYPE</text>
<text class="th" x="100" y="235" text-anchor="end">VARIANT</text>
<text class="ts" x="40" y="130" text-anchor="start">Configuration (cmap)</text>

<text class="ts" x="340" y="410" text-anchor="middle">Lower case: internal names. Upper case: external names.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
